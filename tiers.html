<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusiCave | Tiers</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="avaliar-page">

    <header class="header">
        <div class="header-inner">
            <div class="logo">MUSICAVE</div>
            <nav class="menu">
                <a href="index.html">Início</a>
                <a href="sobre.html">Sobre</a>
                <a class="active" href="tiers.html">Tiers</a>
            </nav>
            <div class="header-actions">
                <a href="entrar.html" class="btn-nav" style="text-decoration: none;">Entrar</a>
            </div>
        </div>
    </header>

    <main class="main-tiers">
        <div id="homeView">
            <section class="glass-card fade-in">
                <h2 class="section-title">➕ Adicionar Álbum</h2>
                <form id="albumForm">
                    <div class="form-grid-tiers">
                        <div class="form-left">
                            <div class="input-group">
                                <label for="albumName">Nome do Álbum</label>
                                <input type="text" id="albumName" placeholder="Ex: ASTROWORLD">
                            </div>
                            <div class="input-group">
                                <label for="artistName">Artista</label>
                                <input type="text" id="artistName" placeholder="Ex: Travis Scott">
                            </div>
                            <div class="upload-wrapper">
                                <label class="btn-upload" for="coverUpload">Selecionar Capa</label>
                                <input type="file" id="coverUpload" accept="image/*" style="display: none;">
                                <button type="button" id="clearCover" class="btn-danger hidden">✕</button>
                            </div>
                        </div>
                        <div class="form-right">
                            <div class="preview-box">
                                <img id="coverPreview" class="cover-preview hidden" src="" alt="Preview">
                                <div id="previewPlaceholder">Preview da Capa</div>
                            </div>
                            <div class="input-group">
                                <label for="tracklist">Tracklist (uma por linha)</label>
                                <textarea id="tracklist" placeholder="1. STARGAZING&#10;2. CAROUSEL..."></textarea>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="pill-home" style="width: 100%; justify-content: center;">➕ Adicionar à Coleção</button>
                </form>
            </section>

            <section class="tier-section fade-in">
                <h2 class="main-title" style="font-size: 2rem; text-align: left; margin: 4vh 0 2vh;">Sua Coleção</h2>
                <div id="tierList" class="tier-grid-container"></div>
            </section>
        </div>

        <div id="evalView" class="hidden">
            <button id="backBtn" class="btn-back">← Voltar para a Lista</button>
            <div class="glass-card fade-in">
                <div class="eval-header-top">
                    <img id="evalCover" class="eval-cover-img" src="" alt="">
                    <div id="evalCoverPlaceholder" class="eval-cover-img hidden" style="background: #111; display: flex; align-items: center; justify-content: center;">🎵</div>
                    <div class="eval-info">
                        <h2 id="evalAlbumName" class="highlight"></h2>
                        <p id="evalArtistName"></p>
                    </div>
                </div>

                <div class="slider-container">
                    <div class="slider-header">
                        <span>Nota do Conceito</span>
                        <span id="conceptValue" class="highlight">5.0</span>
                    </div>
                    <input type="range" id="conceptSlider" min="0" max="10" step="0.5" value="5">
                </div>

                <div id="tracksEvaluation"></div>

                <div class="btn-group-eval">
                    <button id="saveNotesBtn" class="btn-secondary">💾 Salvar</button>
                    <button id="calculateBtn" class="btn-nav" style="flex: 2;">🧮 Calcular Nota</button>
                    <button id="exportPdfBtn" class="btn-secondary">📄 PDF</button>
                </div>
            </div>
        </div>
    </main>

    <div id="deleteModal" class="modal-overlay hidden">
        <div class="login-card" style="max-width: 400px; padding: 2rem;">
            <h3>Remover álbum?</h3>
            <p style="margin: 1rem 0;">Isso apagará todas as notas deste álbum permanentemente.</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button id="cancelDelete" class="btn-nav" style="background: #222;">Cancelar</button>
                <button id="confirmDelete" class="btn-nav" style="background: #ff4444;">Sim, Remover</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden">
        <div id="toastTitle" style="font-weight: bold; color: #b112f1;"></div>
        <div id="toastMessage"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
