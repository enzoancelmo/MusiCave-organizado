<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusiCave - Meu Perfil</title>
    <!-- Certifique-se de que o CSS está apontando para o caminho correto -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ==========================================================================
           ESTILOS EXCLUSIVOS DO PERFIL
           ========================================================================== */
        .profile-page {
            padding-top: 15vh;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 5vh;
        }

        .profile-hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(13, 13, 13, 0.8);
            backdrop-filter: blur(10px);
            border: 0.1rem solid #222;
            padding: 2.5rem;
            border-radius: 1.25rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .profile-main-info {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .profile-avatar-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #b112f1;
            box-shadow: 0 0 20px rgba(177, 18, 241, 0.4);
            overflow: hidden;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar-fallback {
            font-size: 3rem;
            color: #b112f1;
        }

        .profile-name-block h1 {
            font-size: 2.2rem;
            margin-bottom: 0.3rem;
        }

        .profile-name-block p {
            color: #888;
            font-size: 1rem;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #b112f1;
            color: #fff;
            padding: 0.8rem 1.5rem;
            border-radius: 0.6rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-outline:hover {
            background: rgba(177, 18, 241, 0.2);
            box-shadow: 0 0 15px rgba(177, 18, 241, 0.3);
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .profile-stat-card {
            background: rgba(13, 13, 13, 0.8);
            border: 1px solid #222;
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            transition: 0.3s;
        }

        .profile-stat-card:hover {
            border-color: #b112f1;
            transform: translateY(-3px);
        }

        .profile-stat-card span {
            display: block;
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .profile-stat-card strong {
            font-size: 2.2rem;
            color: #b112f1;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(177, 18, 241, 0.4);
        }

        .profile-panel-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .profile-album-card {
            background: rgba(13, 13, 13, 0.8);
            border: 0.1rem solid #222;
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .profile-album-card:hover {
            transform: translateY(-5px);
            border-color: #b112f1;
            box-shadow: 0 0 15px rgba(177, 18, 241, 0.3);
        }

        .profile-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 0.6rem;
            border: 2px solid #b112f1;
            margin-bottom: 1rem;
        }

        .profile-score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }

        .profile-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .profile-modal-card {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 1.25rem;
            padding: 2.5rem;
            width: 90%;
            max-width: 450px;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }

        .modal-close {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal-close:hover { color: #b112f1; }

        .profile-edit-avatar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin: 2rem 0;
        }

        .profile-edit-avatar img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #b112f1;
            object-fit: cover;
        }

        .profile-modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .profile-hero { flex-direction: column; text-align: center; gap: 1.5rem; }
            .profile-main-info { flex-direction: column; }
            .profile-modal-actions { flex-direction: column; }
        }
    </style>
</head>
<body class="login-body">

    <header class="header">
        <div class="header-inner">
            <div class="logo">MUSI<span class="highlight">CAVE</span></div>
            <nav class="menu">
                <a href="index.html">Início</a>
                <a href="sobre.html">Sobre</a>
                <a href="tiers.html">Tiers</a>
            </nav>
            <div class="header-actions">
                <button id="logoutBtn" class="btn-contact" style="min-width: 100px; padding: 0.5rem 1rem; background: #222;">Sair</button>
            </div>
        </div>
    </header>

    <main class="profile-page">
        <!-- HERO DO PERFIL -->
        <section class="profile-hero fade-in">
            <div class="profile-main-info">
                <div class="profile-avatar-wrap">
                    <img id="profileAvatar" class="profile-avatar hidden" src="" alt="Foto de perfil">
                    <div id="profileAvatarFallback" class="profile-avatar-fallback">♪</div>
                </div>
                <div class="profile-name-block">
                    <h1 id="profileName">Carregando...</h1>
                    <p id="profileSince">Membro desde: Outubro/2026</p>
                </div>
            </div>
            <button id="editProfileBtn" class="btn-outline" type="button">✎ Editar perfil</button>
        </section>

        <!-- ESTATÍSTICAS -->
        <section class="profile-stats fade-in">
            <div class="profile-stat-card"><span>AVALIAÇÕES</span><strong id="statEvaluations">0</strong></div>
            <div class="profile-stat-card"><span>MÉDIA GERAL</span><strong id="statAverage">0.0</strong></div>
            <div class="profile-stat-card"><span>TIER LISTS</span><strong id="statTierLists">0</strong></div>
            <div class="profile-stat-card"><span>FAIXAS</span><strong id="statTracks">0</strong></div>
        </section>

        <!-- CAIXA DE TIERS E AVALIAÇÕES -->
        <section class="fade-in">
            <div class="profile-panel-title">
                <span class="highlight">▤</span> Minha Caverna Musical
            </div>
            <div class="profile-grid" id="tierLists">
                <!-- Os cards de álbuns serão injetados aqui via JS -->
            </div>
            
            <div style="text-align: center; margin-top: 2rem;">
                <button class="btn-login" style="width: auto; padding: 1rem 3rem;" onclick="window.location.href='tiers.html'">＋ Adicionar Novo Álbum</button>
            </div>
        </section>
    </main>

    <!-- MODAL DE EDIÇÃO DE PERFIL -->
    <div id="editProfileModal" class="profile-modal hidden">
        <div class="profile-modal-card fade-in">
            <button id="closeProfileModal" class="modal-close" type="button">×</button>
            <h2 class="highlight">Editar perfil</h2>
            <p style="color: #888; font-size: 0.9rem;">Altere seu nome e sua foto de perfil.</p>

            <div class="profile-edit-avatar">
                <img id="editAvatarPreview" src="" alt="Preview da foto">
                <label class="upload-btn" for="profileImageInput">Trocar foto</label>
                <input id="profileImageInput" type="file" accept="image/*" hidden>
            </div>

            <div class="input-group">
                <label for="profileNameInput" style="display:block; color:#888; font-weight:bold; margin-bottom:0.5rem; font-size:0.8rem; text-transform:uppercase;">Nome de Usuário</label>
                <input id="profileNameInput" type="text" maxlength="80" style="width:100%; padding:0.8rem; background:#111; border:1px solid #333; border-radius:0.6rem; color:#fff;" required>
            </div>

            <div class="profile-modal-actions">
                <button id="cancelProfileBtn" class="btn-contact" style="background: #222; flex: 1;" type="button">Cancelar</button>
                <button id="saveProfileBtn" class="btn-login" style="flex: 1;" type="button">Salvar</button>
            </div>
        </div>
    </div>

    <!-- MOCK DE DADOS E LÓGICA DO FRONT-END -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // 1. CARREGAR DADOS DO USUÁRIO
            let user = JSON.parse(localStorage.getItem("musicaveUser"));
            if (!user) {
                user = { name: "Ryan Soares", avatar: "" }; 
            }

            const profileName = document.getElementById("profileName");
            const profileAvatar = document.getElementById("profileAvatar");
            const profileAvatarFallback = document.getElementById("profileAvatarFallback");
            const profileNameInput = document.getElementById("profileNameInput");
            const editAvatarPreview = document.getElementById("editAvatarPreview");

            // Atualiza tela com dados
            profileName.textContent = user.name || "Visitante";
            profileNameInput.value = user.name || "";

            if(user.avatar) {
                profileAvatar.src = user.avatar;
                profileAvatar.classList.remove("hidden");
                profileAvatarFallback.classList.add("hidden");
                editAvatarPreview.src = user.avatar;
            } else {
                editAvatarPreview.src = "assets/boneco%20musicave.png"; // Fallback para preview
            }

            // 2. DADOS FALSOS (Mockup)
            const mockAlbums = [
                { name: "ASTROWORLD", artist: "Travis Scott", tier: "S", score: 9.2, cover: "https://i.scdn.co/image/ab67616d0000b273072e9faef2ef7b6db63834a3", tracks: 17 },
                { name: "Graduation", artist: "Kanye West", tier: "S", score: 9.5, cover: "https://i.scdn.co/image/ab67616d0000b27326f7f19c7f0381e56156c94a", tracks: 14 },
                { name: "DAMN.", artist: "Kendrick Lamar", tier: "A", score: 8.8, cover: "https://i.scdn.co/image/ab67616d0000b2738b52c6b9bc4e43d873869699", tracks: 14 },
                { name: "Starboy", artist: "The Weeknd", tier: "B", score: 7.0, cover: "https://i.scdn.co/image/ab67616d0000b273a048415c345304f1cebefbfc", tracks: 18 }
            ];

            // 3. ATUALIZAR ESTATÍSTICAS
            let totalScore = mockAlbums.reduce((acc, alb) => acc + alb.score, 0);
            let avgScore = (totalScore / mockAlbums.length).toFixed(1);
            let totalTracks = mockAlbums.reduce((acc, alb) => acc + alb.tracks, 0);

            document.getElementById("statEvaluations").textContent = mockAlbums.length;
            document.getElementById("statAverage").textContent = avgScore;
            document.getElementById("statTierLists").textContent = mockAlbums.length;
            document.getElementById("statTracks").textContent = totalTracks;

            // 4. RENDERIZAR GRID COM BOTÕES EDITAR E EXCLUIR
            const tierLists = document.getElementById("tierLists");
            tierLists.innerHTML = mockAlbums.map(album => `
                <div class="profile-album-card" id="card-${album.name.replace(/\s+/g, '')}">
                    <img src="${album.cover}" alt="Capa" class="profile-cover">
                    <h3 style="font-size: 1.1rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${album.name}</h3>
                    <p style="color: #888; font-size: 0.85rem;">${album.artist}</p>
                    <div class="profile-score-row">
                        <span style="font-weight: 800; font-size: 0.9rem;">Nota: ${album.score}</span>
                        <span class="tier-badge tier-${album.tier.toLowerCase()}" style="padding: 4px 10px; font-size: 0.9rem; min-width: 30px;">${album.tier}</span>
                    </div>
                    
                    <!-- BOTÕES DE EDITAR E EXCLUIR -->
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button class="btn-login compact-btn" style="flex: 1; font-size: 0.8rem; padding: 0.5rem;" onclick="editarAvaliacao('${album.name}')">✏️️ Editar</button>
                        <button class="btn-contact danger-btn" style="flex: 1; font-size: 0.8rem; padding: 0.5rem;" onclick="excluirAvaliacao('${album.name}')">🗑️ Excluir</button>
                    </div>
                </div>
            `).join('');

            // 5. LÓGICA DO MODAL DE EDIÇÃO E FOTO
            const modal = document.getElementById("editProfileModal");
            const btnOpen = document.getElementById("editProfileBtn");
            const btnClose = document.getElementById("closeProfileModal");
            const btnCancel = document.getElementById("cancelProfileBtn");
            const btnSave = document.getElementById("saveProfileBtn");
            const imageInput = document.getElementById("profileImageInput");

            btnOpen.addEventListener("click", () => modal.classList.remove("hidden"));
            const closeModal = () => modal.classList.add("hidden");
            btnClose.addEventListener("click", closeModal);
            btnCancel.addEventListener("click", closeModal);

            let tempAvatarBase64 = user.avatar || "";
            imageInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        tempAvatarBase64 = reader.result;
                        editAvatarPreview.src = tempAvatarBase64;
                    };
                    reader.readAsDataURL(file);
                }
            });

            btnSave.addEventListener("click", () => {
                const newName = profileNameInput.value.trim();
                if(!newName) return alert("O nome não pode ficar vazio!");

                user.name = newName;
                if(tempAvatarBase64) user.avatar = tempAvatarBase64;
                localStorage.setItem("musicaveUser", JSON.stringify(user));

                profileName.textContent = newName;
                if(tempAvatarBase64) {
                    profileAvatar.src = tempAvatarBase64;
                    profileAvatar.classList.remove("hidden");
                    profileAvatarFallback.classList.add("hidden");
                }
                
                closeModal();
            });

            // 6. LOGOUT
            document.getElementById("logoutBtn").addEventListener("click", () => {
                localStorage.removeItem("musicaveUser");
                window.location.href = "entrar.html";
            });
        });

        // 7. FUNÇÕES DOS BOTÕES DE EDITAR E EXCLUIR NO PERFIL
        function editarAvaliacao(nomeAlbum) {
            // Lógica para enviar o usuário para a página de edição (tiers.html)
            alert(`Indo para a edição do álbum: ${nomeAlbum}`);
            window.location.href = 'tiers.html';
        }

        function excluirAvaliacao(nomeAlbum) {
            const confirmacao = confirm(`Tem certeza que deseja excluir a avaliação de "${nomeAlbum}" do seu perfil?`);
            if (confirmacao) {
                // Remove o card visualmente para simular a exclusão
                const cardId = `card-${nomeAlbum.replace(/\s+/g, '')}`;
                document.getElementById(cardId).style.display = 'none';
                alert(`Avaliação do álbum "${nomeAlbum}" excluída com sucesso!`);
            }
        }
    </script>
</body>
</html>
